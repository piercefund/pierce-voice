<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
    />
    <title>Confirm your email | Pierce</title>
    <link rel="stylesheet" href="/email.css" />
    <script src="/email.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="https://pierce.fund" aria-label="Pierce home">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Pierce</span>
      </a>
    </header>

    <main>
      <section class="email-panel" aria-labelledby="pageTitle">
        <p class="eyebrow">Secure email confirmation</p>
        <h1 id="pageTitle">Where should we send your recap?</h1>
        <p class="intro">
          Enter the email you want Pierce to use for the recap from your phone check-in.
        </p>

        <div id="loadingState" class="status" role="status">Checking your secure link...</div>

        <form id="emailForm" hidden novalidate>
          <label for="guestEmail">Email address</label>
          <input
            id="guestEmail"
            name="guest_email"
            type="email"
            inputmode="email"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            maxlength="254"
            required
          />
          <p id="emailError" class="field-error" role="alert" hidden></p>

          <label class="confirmation" for="emailConfirmed">
            <input id="emailConfirmed" name="email_confirmed" type="checkbox" required />
            <span>I checked that this email is correct.</span>
          </label>

          <button id="submitButton" type="submit">Send my recap</button>
        </form>

        <div id="resultState" class="result" role="status" hidden></div>

        <p class="legal">
          This one-time link expires shortly and works once.
          <a href="https://pierce.fund/privacy" rel="noreferrer">Privacy</a>
          <span aria-hidden="true">·</span>
          <a href="https://pierce.fund/terms" rel="noreferrer">Terms</a>
        </p>
      </section>
    </main>
  </body>
</html>
